<div 
    id="popup-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center w-full h-full bg-gray-900/70"
    >
    <div class="w-full max-w-md p-4">
        <div class="bg-blue-800/80 rounded-lg shadow-md relative">
            <button 
                (click)="closePopUp()" 
                type="button" 
                class="absolute top-3 right-3 text-gray-300 hover:text-white transition-colors"
                >
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path 
                        stroke="currentColor" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        stroke-width="2" 
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
                        />
                </svg>
            </button>
            <div class="p-6 text-center space-y-4">
                <svg 
                    class="mx-auto text-gray-200 w-12 h-12" 
                    xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 20 20"
                    >
                    <path 
                        stroke="currentColor" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        stroke-width="2" 
                        d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                        />
                </svg>
                <h3 class="text-lg font-medium text-gray-200">
                    ¿Está seguro de eliminar el/los usuarios seleccionados?
                </h3>
                <div class="flex justify-center gap-3 pt-2">
                    <button 
                        (click)="confirmDelete()" 
                        type="button" 
                        class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 focus:ring-2 focus:ring-red-400"
                        >
                    Sí, estoy seguro
                    </button>
                    <button 
                        (click)="closePopUp()" 
                        type="button" 
                        class="px-5 py-2.5 text-sm font-medium rounded-md border border-gray-300 bg-white text-gray-800 hover:bg-gray-100"
                        >
                    No, cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
